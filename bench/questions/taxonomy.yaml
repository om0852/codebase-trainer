repo: taxonomy
questions:
  - id: tx-locate-01
    type: locate
    split: dev
    question: "how does a signed-in user cancel or manage their paid plan"
    files: [app/api/users/stripe/route.ts, components/billing-form.tsx]
    note: "GET handler calls stripe.billingPortal.sessions.create when subscriptionPlan.isPro; BillingForm fetches /api/users/stripe"
  - id: tx-locate-02
    type: locate
    split: dev
    question: "where do we decide if someone is on the pro tier or the free tier"
    files: [lib/subscription.ts, config/subscriptions.ts]
    note: "getUserSubscriptionPlan computes isPro from stripePriceId and stripeCurrentPeriodEnd + 1 day grace; freePlan/proPlan constants"
  - id: tx-locate-03
    type: locate
    split: dev
    question: "where is the limit that stops free users from writing more than three posts"
    files: [app/api/posts/route.ts, lib/exceptions.ts]
    note: "POST checks db.post.count >= 3 for non-pro users and throws RequiresProPlanError, returned as 402"
  - id: tx-locate-04
    type: locate
    split: dev
    question: "how do we keep the user's subscription in sync after Stripe charges them"
    files: [app/api/webhooks/stripe/route.ts]
    note: "Handles checkout.session.completed and invoice.payment_succeeded, updating stripePriceId and stripeCurrentPeriodEnd via db.user.update"
  - id: tx-locate-05
    type: locate
    split: holdout
    question: "how are logged-out visitors bounced away from the dashboard and editor pages"
    files: [middleware.ts]
    note: "withAuth middleware redirects to /login?from=... when no token; matcher covers /dashboard/:path* and /editor/:path*"
