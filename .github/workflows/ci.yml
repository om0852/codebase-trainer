name: CI/CD Pipeline - Codebase Trainer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Security Audit (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Required to upload SARIF results to GitHub Code Scanning
      security-events: write

    strategy:
      # Report every combination's result instead of cancelling the others on the first failure
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 reached end of life in April 2026
        node-version: [22.x, 24.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Compile TypeScript
        run: npm run build

      - name: 🧪 Run Test Suite
        run: npm test

      - name: 📡 Check Client-to-Server API Contract Drift
        run: node dist/cli/index.js drift

      - name: 🛡️ Run Static Security & Secret Audit
        run: node dist/cli/index.js security

      - name: 📊 Export SARIF Vulnerability Report
        run: node dist/cli/index.js ci

      # One upload per run: Code Scanning rejects several uploads under the same category
      - name: 📤 Upload SARIF Security Artifact
        uses: github/codeql-action/upload-sarif@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' && hashFiles('.codebase/results.sarif') != ''
        with:
          sarif_file: .codebase/results.sarif
          category: codebase-trainer-security

  benchmark:
    name: Retrieval Benchmark (regression check)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📚 Clone Benchmark Corpus (pinned commits)
        run: npm run bench:setup

      # Dev questions only; the holdout split is kept for release checks so day-to-day tuning cannot overfit it
      - name: 📏 Run Benchmark Against Baseline
        run: npm run bench -- --split=dev --baseline=bench/baseline-dev.json

      - name: 📤 Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/results/

  docker-build:
    name: Container Image Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/codebase-trainer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
