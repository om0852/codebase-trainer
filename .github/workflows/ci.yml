name: CI/CD Pipeline - Codebase Trainer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/checkout@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Compile TypeScript
        run: npm run build

      - name: 🧪 Run Unit & Algorithm Test Suite
        run: npx tsx tests/unit.test.ts

      - name: 🛡️ Run Static Security & Secret Audit
        run: node dist/cli/index.js security

      - name: 📊 Export SARIF Vulnerability Report
        run: node dist/cli/index.js ci

      - name: 📤 Upload SARIF Security Artifact
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .codebase/sarif_report.json
          category: codebase-trainer-security

  docker-build:
    name: Container Image Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/codebase-trainer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
